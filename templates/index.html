<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnggFeed</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "19f657ada38944bb936eae94c33ba6f7"}'></script>
</head>
<body
  x-data="app()"
  x-init="_init()"
  @keydown.escape.window="handleEsc()"
>

  <nav class="navbar">
    <a class="navbar-logo" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span class="navbar-brand">
        EnggFeed
        <span class="navbar-tagline">Stay ahead of the stack.</span>
      </span>
    </a>

    <div class="navbar-spacer"></div>
  </nav>

  <div x-show="flashMessage" x-cloak class="flash-bar" role="alert">
    <span x-text="flashMessage"></span>
    <button class="flash-close" @click="flashMessage = ''" aria-label="Dismiss">&times;</button>
  </div>

  <div>

    <div class="filter-strip">

      <!-- Company row -->
      <div class="filter-row">
        <span class="filter-row-label">Company</span>
        <div class="filter-scroll-wrap">
          <div class="filter-scroll">
            <!-- All companies pill -->
            <button
              class="filter-pill"
              :class="{ active: activeSources.length === 0 }"
              @click="activeSources = []; _pushUrl(); _fetchBlogs()"
              type="button"
            >All</button>
            <template x-for="src in sources" :key="src.id">
              <button
                class="filter-pill"
                :class="{ active: activeSources.includes(src.source) }"
                @click="toggleSource(src.source)"
                type="button"
              >
                <img
                  class="filter-pill-favicon"
                  :src="'https://www.google.com/s2/favicons?domain=' + sourceToFaviconDomain(src.source) + '&sz=32'"
                  :alt="src.source"
                  @error="$event.target.style.display='none'"
                />
                <span x-text="src.source"></span>
              </button>
            </template>
          </div>
        </div>
        <button
          class="filter-toggle-btn"
          @click="activeFilterModal = 'company'"
          type="button"
        >
          <span>More</span>
          <span class="filter-toggle-chevron">&#9662;</span>
        </button>
      </div>

      <!-- Topic row -->
      <template x-if="tags.length > 0">
        <div class="filter-row">
          <span class="filter-row-label">Topic</span>
          <div class="filter-scroll-wrap">
            <div class="filter-scroll">
              <template x-for="t in tags" :key="t.tag">
                <button
                  class="filter-pill"
                  :class="{ active: activeTags.includes(t.tag) }"
                  @click="toggleTag(t.tag)"
                  type="button"
                >
                  <span x-text="t.tag"></span>
                  <span class="filter-pill-count" x-text="t.count"></span>
                </button>
              </template>
            </div>
          </div>
          <button
            class="filter-toggle-btn"
            @click="activeFilterModal = 'topic'"
            type="button"
          >
            <span>More</span>
            <span class="filter-toggle-chevron">&#9662;</span>
          </button>
        </div>
      </template>

    </div><!-- /filter-strip -->

    <div class="main-wrap">

      <!-- Loading spinner -->
      <div class="spinner-wrap" x-show="feedLoading" x-cloak>
        <div class="spinner"></div>
      </div>

      <!-- Empty state -->
      <div class="empty-state" x-show="!feedLoading && blogs.length === 0 && allLoaded" x-cloak>
        <svg width="220" height="160" viewBox="0 0 220 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="220" height="160" rx="12" fill="#f3f4f6"/>
          <circle cx="95" cy="75" r="30" stroke="#d1d5db" stroke-width="6" fill="none"/>
          <line x1="117" y1="97" x2="137" y2="117" stroke="#d1d5db" stroke-width="6" stroke-linecap="round"/>
          <line x1="83" y1="63" x2="107" y2="87" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
          <line x1="107" y1="63" x2="83" y2="87" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
        </svg>
        <p class="empty-title">No articles found for the selected filters</p>
        <p class="empty-sub">Try selecting different companies or topics.</p>
        <button class="btn-clear-filters" @click="clearFilters()">Clear Filters</button>
      </div>

      <!-- Card grid -->
      <div x-show="!feedLoading && blogs.length > 0" x-cloak>
        <div class="card-grid">
          <template x-for="(blog, index) in blogs" :key="blog.id">
            <div style="display: contents;" x-data="{ prereqsExpanded: false, tagsExpanded: false }">

              <!-- Ad strip after first row (after index 2, i.e. the 3rd card) -->
              <template x-if="index === 3">
                <div class="ad-strip">
                  <div class="ad-unit">
                    <div class="ad-body">
                      <div class="ad-headline">Know an engineer who'd love this?</div>
                      <div class="ad-description">One feed for every major engineering blog. Browse by topic or company, get AI summaries, ELI5 explanations, and prerequisites. Everything you need to stay sharp.</div>
                    </div>
                    <a class="ad-cta" href="#" @click.prevent="copyUrl(window.location.origin)" x-text="copied ? 'Copied!' : 'Share'"></a>
                  </div>
                </div>
              </template>

              <!-- Share strip after index 15 -->
              <template x-if="index === 15">
                <div class="ad-strip">
                  <div class="ad-unit">
                    <div class="ad-body">
                      <div class="ad-headline">Enjoying the feed? Share it with a friend</div>
                      <div class="ad-description">Netflix, Cloudflare, Stripe, and more — all in one place. Filter by topic, read what matters, understand it faster.</div>
                    </div>
                    <a class="ad-cta" href="#" @click.prevent="copyUrl(window.location.origin)" x-text="copied ? 'Copied!' : 'Share'"></a>
                  </div>
                </div>
              </template>

              <!-- Blog card -->
              <article class="card">

                <!-- Thumbnail (clickable → opens original in new tab) -->
                <a :href="blog.link" target="_blank" rel="noopener noreferrer" class="card-thumb-link" :aria-label="'Read ' + blog.title + ' on ' + blog.source">
                  <template x-if="blog.thumbnail">
                    <img class="card-thumb" :src="blog.thumbnail" :alt="blog.title" loading="lazy" />
                  </template>
                  <template x-if="!blog.thumbnail">
                    <div class="card-thumb-placeholder">
                      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <polyline points="21 15 16 10 5 21"/>
                      </svg>
                    </div>
                  </template>
                  <!-- Company name badge -->
                  <span class="card-company-badge" x-text="blog.source"></span>
                  <!-- New-tab hint -->
                  <span class="card-new-tab-hint" aria-hidden="true">&#8599;</span>
                </a>

                <div class="card-body">

                  <!-- Title (clickable → opens original in new tab) -->
                  <a :href="blog.link" target="_blank" rel="noopener noreferrer" class="card-title" x-text="blog.title"></a>

                  <!-- Published date -->
                  <p class="card-published" x-text="formatDateShort(blog.published_at)"></p>

                  <!-- Limited content badge -->
                  <template x-if="blog.content_tier === 'LIMITED'">
                    <div class="chips-row">
                      <span class="badge-limited">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                          <circle cx="12" cy="12" r="10"/>
                          <line x1="12" y1="8" x2="12" y2="12"/>
                          <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        Limited content
                      </span>
                    </div>
                  </template>

                  <!-- Prerequisites chips (Partial + Full tier only) -->
                  <template x-if="blog.content_tier !== 'LIMITED' && blog.prerequisites && blog.prerequisites.length > 0">
                    <div class="chips-section">
                      <div class="chip-section-label">Prerequisites</div>
                      <div class="chips-row" role="list" aria-label="Prerequisites">
                        <template x-for="prereq in (prereqsExpanded ? blog.prerequisites : blog.prerequisites.slice(0, 3))" :key="prereq">
                          <button
                            class="chip chip-prereq"
                            role="listitem"
                            @click="openPrereqModal(prereq)"
                            :title="prereq"
                            x-text="prereq"
                          ></button>
                        </template>
                        <template x-if="blog.prerequisites.length > 3">
                          <button
                            class="chip chip-more"
                            @click="prereqsExpanded = !prereqsExpanded"
                            x-text="prereqsExpanded ? 'Show less' : '+' + (blog.prerequisites.length - 3) + ' more'"
                          ></button>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Tags chips -->
                  <template x-if="blog.content_tier !== 'LIMITED' && blog.tags && blog.tags.length > 0">
                    <div class="chips-section">
                      <div class="chip-section-label">Tags</div>
                      <div class="chips-row" role="list" aria-label="Tags">
                        <template x-for="tag in (tagsExpanded ? blog.tags : blog.tags.slice(0, 3))" :key="tag">
                          <button
                            class="chip chip-tag"
                            role="listitem"
                            @click="filterByTag(tag)"
                            :title="'Filter by ' + tag"
                            x-text="tag"
                          ></button>
                        </template>
                        <template x-if="blog.tags.length > 3">
                          <button
                            class="chip chip-more"
                            @click="tagsExpanded = !tagsExpanded"
                            x-text="tagsExpanded ? 'Show less' : '+' + (blog.tags.length - 3) + ' more'"
                          ></button>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Card footer: flag + action buttons -->
                  <div class="card-footer">

                    <!-- Flag button (non-LIMITED only) -->
                    <button class="btn-flag" x-show="blog.content_tier !== 'LIMITED'" :id="blog.id" onclick="openCardFeedbackModal(this.id)">
                      &#9873; Report incorrect tags, prerequisites
                    </button>

                    <!-- Action buttons -->
                    <div class="card-actions">

                      <!-- Summary button: hidden for LIMITED -->
                      <button x-show="blog.content_tier !== 'LIMITED'" class="btn-card-action" @click="window.location.href = '/summary/' + blog.id">
                        Summary
                      </button>

                      <!-- Simplify button: FULL tier only -->
                      <button x-show="blog.content_tier === 'FULL'" class="btn-card-action" @click="window.location.href = '/simplify/' + blog.id">
                        Simplify
                      </button>

                    </div><!-- /card-actions -->

                  </div><!-- /card-footer -->

                </div><!-- /card-body -->
              </article><!-- /card -->

            </div><!-- /display:contents wrapper -->
          </template>
        </div><!-- /card-grid -->

        <!-- Infinite scroll sentinel -->
        <div id="scroll-sentinel" class="scroll-sentinel"></div>

        <!-- Scroll loading indicator -->
        <div class="scroll-loading" x-show="scrollLoading" x-cloak>
          <div class="spinner-sm"></div>
        </div>
      </div>

    </div><!-- /main-wrap -->
  </div><!-- /feed view -->


  <div
    class="modal-backdrop"
    x-show="showPrereqModal"
    x-cloak
    @click.self="showPrereqModal = false"
    role="dialog"
    aria-modal="true"
    :aria-label="prereqTopic"
  >
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" x-text="prereqTopic"></h2>
        <button class="modal-close" @click="showPrereqModal = false" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">

        <!-- Loading spinner -->
        <div class="spinner-wrap" x-show="prereqLoading" x-cloak style="padding: 32px 0;">
          <div class="spinner"></div>
        </div>

        <!-- Error / not-yet-available state -->
        <div class="prereq-error" x-show="!prereqLoading && prereqError" x-cloak>
          <p>This topic isn't ready yet — check back after the next update.</p>
        </div>

        <!-- Content (Primer by default; Deep dive revealed on Read more) -->
        <template x-if="!prereqLoading && !prereqError && prereqDetail">
          <div>
            <!-- Definition (only if non-empty) -->
            <template x-if="prereqDetail?.primer?.definition">
              <p class="prereq-definition" x-text="prereqDetail?.primer?.definition"></p>
            </template>

            <!-- Why it matters (only if non-empty) -->
            <template x-if="prereqDetail?.primer?.why_it_matters">
              <div class="prereq-block">
                <div class="prereq-block-label">Why it matters</div>
                <p class="prereq-block-text" x-text="prereqDetail?.primer?.why_it_matters"></p>
              </div>
            </template>

            <!-- Example (only if non-empty) -->
            <template x-if="prereqDetail?.primer?.example">
              <div class="prereq-block">
                <div class="prereq-block-label">Example</div>
                <p class="prereq-block-text" x-text="prereqDetail?.primer?.example"></p>
              </div>
            </template>

            <!-- "Read more" button — only shown if deep_dive exists and not yet expanded -->
            <template x-if="prereqDetail?.deep_dive && !prereqShowDeepDive">
              <button class="btn-read-more" @click="prereqShowDeepDive = true">Read more</button>
            </template>

            <!-- Deep dive section (revealed after Read more) -->
            <template x-if="prereqDetail?.deep_dive && prereqShowDeepDive">
              <div class="prereq-deep-dive">
                <div class="prereq-deep-label">Deep Dive</div>
                <p class="prereq-deep-text" x-text="prereqDetail.deep_dive"></p>
              </div>
            </template>
          </div>
        </template>

      </div>
    </div>
  </div><!-- /prereq modal -->


  <div
    class="modal-backdrop"
    x-show="activeFilterModal !== null"
    x-cloak
    @click.self="activeFilterModal = null"
    role="dialog"
    aria-modal="true"
    aria-label="Filters"
  >
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" x-text="activeFilterModal === 'company' ? 'Company' : 'Topic'"></h2>
        <button class="modal-close" @click="activeFilterModal = null" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="filter-modal-pills" x-show="activeFilterModal === 'company'">
          <button
            class="filter-pill"
            :class="{ active: activeSources.length === 0 }"
            @click="activeSources = []; _pushUrl(); _fetchBlogs()"
            type="button"
          >All</button>
          <template x-for="src in sources" :key="src.id">
            <button
              class="filter-pill"
              :class="{ active: activeSources.includes(src.source) }"
              @click="toggleSource(src.source)"
              type="button"
            >
              <img
                class="filter-pill-favicon"
                :src="'https://www.google.com/s2/favicons?domain=' + sourceToFaviconDomain(src.source) + '&sz=32'"
                :alt="src.source"
                @error="$event.target.style.display='none'"
              />
              <span x-text="src.source"></span>
            </button>
          </template>
        </div>
        <div class="filter-modal-pills" x-show="activeFilterModal === 'topic'">
          <template x-for="t in tags" :key="t.tag">
            <button
              class="filter-pill"
              :class="{ active: activeTags.includes(t.tag) }"
              @click="toggleTag(t.tag)"
              type="button"
            >
              <span x-text="t.tag"></span>
              <span class="filter-pill-count" x-text="t.count"></span>
            </button>
          </template>
        </div>
      </div>
    </div>
  </div><!-- /filter modal -->


  <div
    class="modal-backdrop"
    x-show="showFeedbackModal"
    x-cloak
    @click.self="showFeedbackModal = false"
    role="dialog"
    aria-modal="true"
    aria-label="Submit feedback"
  >
    <div class="modal-box feedback-modal-box">
      <div class="modal-header">
        <h2 class="modal-title" x-text="feedbackMode === 'card' ? 'Flag incorrect tags or prerequisites' : (feedbackDetailType === 'summary' ? 'Report incorrect summary' : 'Report incorrect simplification')"></h2>
        <button class="modal-close" @click="showFeedbackModal = false" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <p class="feedback-subtitle" x-text="feedbackMode === 'card' ? 'Help us improve — let us know what\'s wrong and suggest better ones.' : 'What\'s incorrect about this content?'"></p>

        <!-- Card mode: 2 fields -->
        <template x-if="feedbackMode === 'card'">
          <div>
            <div class="feedback-field">
              <label class="feedback-label">Suggested Tags</label>
              <textarea class="feedback-textarea" x-model="feedbackTagText" placeholder="e.g. networking, anycast, cdn" maxlength="500"></textarea>
              <div class="feedback-hint">Comma-separated. Leave blank if tags are fine.</div>
              <div class="feedback-char-count" x-text="feedbackTagText.length + ' / 500'"></div>
            </div>
            <div class="feedback-field">
              <label class="feedback-label">Suggested Prerequisites</label>
              <textarea class="feedback-textarea" x-model="feedbackPrereqText" placeholder="e.g. BGP, DNS, TCP/IP" maxlength="500"></textarea>
              <div class="feedback-hint">Comma-separated. Leave blank if prerequisites are fine.</div>
              <div class="feedback-char-count" x-text="feedbackPrereqText.length + ' / 500'"></div>
            </div>
          </div>
        </template>

        <!-- Detail mode: 1 field -->
        <template x-if="feedbackMode === 'detail'">
          <div class="feedback-field">
            <label class="feedback-label">Your feedback</label>
            <textarea class="feedback-textarea" x-model="feedbackDetailText" placeholder="Describe what's wrong..." maxlength="500"></textarea>
            <div class="feedback-char-count" x-text="feedbackDetailText.length + ' / 500'"></div>
          </div>
        </template>

        <!-- Optional contact info -->
        <div class="feedback-field">
          <label class="feedback-label">Name <span class="feedback-optional">(optional)</span></label>
          <input type="text" class="feedback-input" x-model="feedbackName" placeholder="Your name" maxlength="255">
        </div>
        <div class="feedback-field">
          <label class="feedback-label">Email <span class="feedback-optional">(optional)</span></label>
          <input type="email" class="feedback-input" x-model="feedbackEmail" placeholder="you@example.com" maxlength="255">
        </div>

        <!-- Honeypot — real users never see or fill this -->
        <div class="hp-field" aria-hidden="true">
          <label for="fb-website">Website</label>
          <input type="text" id="fb-website" name="website" x-model="feedbackWebsite" tabindex="-1" autocomplete="off">
        </div>

        <button class="btn-feedback-submit" @click="submitFeedback()" :disabled="feedbackSubmitting" x-text="feedbackSubmitting ? 'Submitting...' : 'Submit Feedback'"></button>
      </div>
    </div>
  </div><!-- /feedback modal -->


  <div
    class="modal-backdrop"
    x-show="showFeedbackSuccess"
    x-cloak
    @click.self="showFeedbackSuccess = false"
    role="dialog"
    aria-modal="true"
    aria-label="Feedback submitted"
  >
    <div class="modal-box feedback-modal-box" style="text-align: center;">
      <div class="modal-header" style="justify-content: flex-end; padding-bottom: 0;">
        <button class="modal-close" @click="showFeedbackSuccess = false" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" style="padding-top: 8px;">
        <div style="font-size: 2rem; margin-bottom: 12px;">&#10003;</div>
        <div style="font-size: 1.05rem; font-weight: 700; color: var(--text-primary); margin-bottom: 8px;">Thank you for your feedback.</div>
        <div style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 20px;">This will help us improve our system.</div>
        <button class="btn-feedback-submit" @click="showFeedbackSuccess = false">Done</button>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js"></script>

</body>
</html>
